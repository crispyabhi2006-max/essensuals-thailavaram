<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essensuals - Admin Appointments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 25px 40px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top-bar h2 {
      margin: 0;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .table-container {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #111;
      color: white;
    }

    tr:hover {
      background: #f8f8f8;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Essensuals Thailavaram</h1>
    <p>Admin Appointment Dashboard</p>
  </div>

  <div class="container">

    <div class="top-bar">
      <h2>Appointments</h2>
      <button onclick="loadAppointments()">Refresh</button>
    </div>

    <div class="table-container">

      <div id="loading" class="loading">
        Loading appointments...
      </div>

      <table id="appointmentsTable" style="display: none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Stylist</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="appointmentsBody"></tbody>
      </table>

      <div id="empty" class="empty" style="display: none;">
        No appointments found.
      </div>

    </div>

  </div>

  <script>
    async function loadAppointments() {
      const loading = document.getElementById("loading");
      const table = document.getElementById("appointmentsTable");
      const empty = document.getElementById("empty");
      const body = document.getElementById("appointmentsBody");

      loading.style.display = "block";
      table.style.display = "none";
      empty.style.display = "none";

      try {
        const response = await fetch(
          "http://localhost:5000/api/appointments"
        );

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.message);
        }

        body.innerHTML = "";

        if (data.appointments.length === 0) {
          loading.style.display = "none";
          empty.style.display = "block";
          return;
        }

        data.appointments.forEach(appointment => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${appointment.id}</td>
            <td>${appointment.name}</td>
            <td>${appointment.phone}</td>
            <td>${appointment.service}</td>
            <td>${appointment.stylist || "First Available Specialist"}</td>
            <td>${appointment.appointment_date}</td>
            <td>${appointment.appointment_time}</td>
            <td>
    <select class="status-select"
        onchange="updateStatus(${appointment.id}, this.value)">
        <option value="Pending" ${appointment.status === "Pending" ? "selected" : ""}>Pending</option>
        <option value="Confirmed" ${appointment.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
        <option value="Completed" ${appointment.status === "Completed" ? "selected" : ""}>Completed</option>
        <option value="Cancelled" ${appointment.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
    </select>
</td>


<td>
  <button onclick="deleteAppointment(${appointment.id})">
    Delete
  </button>
</td>

          `;

          body.appendChild(row);
        });

        loading.style.display = "none";
        table.style.display = "table";

      } catch (error) {

        loading.innerHTML =
          "Unable to load appointments. Make sure the backend server is running.";

        console.error(error);
      }
    }

    loadAppointments();
    async function deleteAppointment(id) {
  if (!confirm("Are you sure you want to delete this appointment?")) {
    return;
  }

  try {
    const response = await fetch(`https://essensuals-thailavaram.onrender.com/api/appointments/${id}`, {
      method: "DELETE"
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message);
    }

    alert("Appointment deleted successfully!");
    loadAppointments();

  } catch (error) {
    console.error("Delete error:", error);
    alert("Unable to delete appointment.");
  }
}
  </script>

</body>
</html>
